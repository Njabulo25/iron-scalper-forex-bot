<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron Scalper | Operator access</title>
<meta name="theme-color" content="#0a1420">
<meta name="csrf-token" content="{{ csrf_token() }}">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/iron-scalper-mark.svg') }}">
<style>
    :root {
        --bg: #08121d;
        --panel: #10202e;
        --line: #294253;
        --text: #e8f2f8;
        --muted: #829aaa;
        --accent: #57d5ca;
        --red: #ff7e91;
    }
    * { box-sizing: border-box; }
    body {
        align-items: center; background:
            radial-gradient(900px 560px at 18% -12%, rgba(48, 145, 156, 0.17), transparent 62%),
            radial-gradient(800px 560px at 105% 105%, rgba(39, 101, 145, 0.12), transparent 62%),
            var(--bg);
        color: var(--text); display: flex; justify-content: center; margin: 0;
        min-height: 100vh; padding: 24px;
        font-family: "Aptos", "Segoe UI Variable", "Inter", "Segoe UI", sans-serif;
    }
    .card {
        background: linear-gradient(155deg, rgba(18, 37, 52, 0.98), rgba(12, 26, 39, 0.98));
        border: 1px solid #2a4354; border-radius: 18px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.38); padding: 34px; width: min(100%, 400px);
    }
    .mark {
        display: block; height: 48px; margin-bottom: 20px; width: 48px;
    }
    h1 { font-size: 22px; font-weight: 680; letter-spacing: -0.45px; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
    label { color: var(--muted); display: block; font-size: 11px; letter-spacing: 0.6px;
        margin: 16px 0 7px; text-transform: uppercase; }
    input {
        background: #0b1824; border: 1px solid var(--line); border-radius: 9px;
        color: var(--text); font-size: 15px; padding: 11px 12px; width: 100%;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(87, 213, 202, 0.10); outline: none; }
    button {
        background: linear-gradient(135deg, #64e1d4, #37c1b7); border: 0; border-radius: 9px; color: #082128;
        cursor: pointer; font-size: 14px; font-weight: 700; margin-top: 22px;
        padding: 12px; width: 100%;
    }
    button:hover { filter: brightness(1.06); }
    .error {
        background: rgba(255, 126, 145, 0.10); border: 1px solid rgba(255, 126, 145, 0.42);
        border-radius: 8px; color: #ffabb7; font-size: 12px; margin-bottom: 6px; padding: 10px;
    }
    .foot { border-top: 1px solid var(--line); color: var(--muted); font-size: 10.5px;
        line-height: 1.6; margin-top: 24px; padding-top: 14px; }
</style>
</head>
<body>
    <main class="card">
        <img class="mark" src="{{ url_for('static', filename='img/iron-scalper-mark.svg') }}" alt="Iron Scalper mark">
        <h1>Iron Scalper</h1>
        <p class="sub">Quant terminal · operator access</p>
        {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
        {% if setup_hint %}<p class="foot">{{ setup_hint }}</p>{% endif %}
        <form method="post" action="/login">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="passphrase">Passphrase</label>
            <input id="passphrase" name="passphrase" type="password" autocomplete="current-password" minlength="12" required>
            <button type="submit">Sign in</button>
        </form>
        <p class="foot">
            Session data stays on this machine. Trading decisions are made by the
            engine, not by this page.
        </p>
    </main>
</body>
</html>
