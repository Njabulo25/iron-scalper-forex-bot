<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron Scalper · Sign in</title>
<style>
    :root {
        --bg: #0b0d10;
        --panel: #11151a;
        --line: #1e252d;
        --text: #e6edf3;
        --muted: #8b98a5;
        --gold: #d8a33a;
        --red: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
        align-items: center; background:
            radial-gradient(1100px 600px at 15% -10%, rgba(216, 163, 58, 0.10), transparent 60%),
            var(--bg);
        color: var(--text); display: flex; justify-content: center; margin: 0;
        min-height: 100vh; padding: 24px;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
        background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); padding: 32px; width: min(100%, 380px);
    }
    .mark {
        align-items: center; background: rgba(216, 163, 58, 0.12);
        border: 1px solid rgba(216, 163, 58, 0.35); border-radius: 9px;
        color: var(--gold); display: inline-flex; font-size: 13px; font-weight: 700;
        height: 34px; justify-content: center; letter-spacing: 1px; margin-bottom: 18px; width: 34px;
    }
    h1 { font-size: 20px; letter-spacing: -0.2px; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 22px; }
    label { color: var(--muted); display: block; font-size: 11px; letter-spacing: 0.6px;
        margin: 16px 0 7px; text-transform: uppercase; }
    input {
        background: #0b0f13; border: 1px solid var(--line); border-radius: 8px;
        color: var(--text); font-size: 15px; padding: 11px 12px; width: 100%;
    }
    input:focus { border-color: var(--gold); outline: none; }
    button {
        background: var(--gold); border: 0; border-radius: 8px; color: #14100a;
        cursor: pointer; font-size: 14px; font-weight: 700; margin-top: 22px;
        padding: 12px; width: 100%;
    }
    button:hover { filter: brightness(1.06); }
    .error {
        background: rgba(239, 68, 68, 0.10); border: 1px solid rgba(239, 68, 68, 0.5);
        border-radius: 8px; color: #fca5a5; font-size: 12px; margin-bottom: 6px; padding: 10px;
    }
    .foot { border-top: 1px solid var(--line); color: var(--muted); font-size: 10.5px;
        line-height: 1.6; margin-top: 24px; padding-top: 14px; }
</style>
</head>
<body>
    <main class="card">
        <div class="mark">IS</div>
        <h1>Iron Scalper</h1>
        <p class="sub">Quantitative gold terminal · operator access</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post" action="/login">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="pin">PIN</label>
            <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>
        <p class="foot">
            Session data stays on this machine. Trading decisions are made by the
            engine, not by this page.
        </p>
    </main>
</body>
</html>
